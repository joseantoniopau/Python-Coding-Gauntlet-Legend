<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Coding Gauntlet Legend — The Algorithm Realms</title>
<link rel="stylesheet" href="/css/game.css">
<style>
/* Bundled pixel face. Falls back to the monospace stack when unavailable. */
@font-face {
  font-family: 'Press Start 2P';
  src: local('Press Start 2P');
  font-display: swap;
}
</style>
<script>window.__GAUNTLET_TOKEN__ = "%%GAUNTLET_SESSION_TOKEN%%";</script>
</head>
<body class="crt">
<div id="app">

  <div id="topbar">
    <div class="brand">GAUNTLET LEGEND<small>THE ALGORITHM REALMS</small></div>
    <div class="vitals">
      <div class="vital">
        <label>STAMINA</label>
        <div class="bar hp"><i id="bar-stamina" style="width:100%"></i></div>
      </div>
      <div class="vital">
        <label>FOCUS</label>
        <div class="bar mana"><i id="bar-mana" style="width:100%"></i></div>
      </div>
      <div class="vital">
        <label id="lvl-label">LV 1 · APPRENTICE</label>
        <div class="bar xp"><i id="bar-xp" style="width:0%"></i></div>
      </div>
      <div class="vital" style="min-width:auto">
        <label>COMBO</label>
        <div class="pixel" id="combo-val" style="color:var(--gold);font-size:11px">x1.0</div>
      </div>
    </div>
    <div class="nav">
      <button class="btn small" data-nav="world">WORLD</button>
      <button class="btn small" data-nav="status">STATUS</button>
      <button class="btn small" data-nav="character">GEAR<span id="points-pip"
        style="display:none;color:var(--gold-hi)"> ●</span></button>
      <button class="btn small" data-nav="quests">QUESTS</button>
      <button class="btn small" data-nav="grimoire">GRIMOIRE</button>
      <button class="btn small" data-nav="interview">INTERVIEW</button>
      <button class="btn small" data-nav="settings">MENU</button>
    </div>
  </div>

  <div id="interview-banner">
    INTERVIEW MODE — NO SPELLS · NO MENTOR · NO PATTERN NAMES · NO COACH ·
    <span id="interview-timer">--:--</span>
  </div>

  <!-- WORLD -->
  <section class="screen" id="screen-world">
    <div id="world-canvas-wrap">
      <canvas id="world-canvas"></canvas>
      <div id="world-overlay">
        <div class="frame" id="region-card">
          <h3 id="region-name">PYTHON VILLAGE</h3>
          <p id="region-blurb"></p>
        </div>
        <div id="world-hint">
          <span class="kbd">WASD</span> / <span class="kbd">↑↓←→</span> move<br>
          <span class="kbd">SPACE</span> interact<br>
          <span class="kbd">N</span> next encounter<br>
          <span class="kbd">F</span> search for secrets
        </div>
      </div>
    </div>
    <aside id="world-side"></aside>
  </section>

  <!-- BATTLE -->
  <section class="screen" id="screen-battle">
    <div id="battle-top">
      <div id="enemy-stage">
        <canvas id="enemy-canvas" width="48" height="48"></canvas>
        <div id="enemy-name">—</div>
        <div id="enemy-hp" class="bar hp"><i style="width:100%"></i></div>
        <div class="small muted" id="enemy-hp-label">0 / 0</div>
      </div>
      <div id="battle-brief">
        <h2 id="problem-title">—</h2>
        <div class="meta" id="problem-meta"></div>
        <div class="statement" id="problem-statement"></div>
        <div id="problem-examples" class="small" style="margin-top:8px"></div>
      </div>
    </div>
    <div id="battle-main">
      <div id="editor-pane">
        <div id="editor-toolbar">
          <button class="btn small" id="btn-run">RUN ▶</button>
          <button class="btn small primary" id="btn-submit">CAST ✦</button>
          <button class="btn small" id="btn-reset">RESET</button>
          <span class="grow"></span>
          <span class="small muted" id="battle-timer">00:00</span>
          <span class="small muted">target <span id="battle-target">—</span></span>
          <button class="btn small danger" id="btn-flee">RETREAT</button>
        </div>
        <div id="editor-host"></div>
      </div>
      <aside id="battle-side">
        <div id="battle-side-tabs">
          <button data-tab="trials" class="active">TRIALS</button>
          <button data-tab="tactics">TACTICS</button>
          <button data-tab="spells">SPELLS</button>
          <button data-tab="approach">APPROACH</button>
          <button data-tab="vision">VISION</button>
        </div>
        <div id="battle-side-body"></div>
      </aside>
    </div>
  </section>

  <!-- PANEL SCREENS -->
  <section class="screen" id="screen-panel">
    <div style="flex:1;overflow-y:auto;padding:18px 22px" id="panel-body"></div>
  </section>

</div>

<div id="dialogue" class="frame">
  <div class="row">
    <canvas id="dialogue-portrait" width="12" height="12"></canvas>
    <div class="grow">
      <div class="who" id="dialogue-who">BYTE</div>
      <div class="what" id="dialogue-what"></div>
      <div class="more">SPACE / CLICK to continue ▾</div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="frame modal" id="modal"></div>
</div>

<div id="toasts"></div>
<div id="crt"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
